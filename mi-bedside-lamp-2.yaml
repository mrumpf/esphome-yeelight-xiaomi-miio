# Xiaomi Mijia Bedside Lamp 2 (yeelink.light.bslamp2)
#
# Uses mmakaay's component from the submodule, which brings the front panel
# HAL together with the behaviour that acts on it: power button, colour button,
# slider, light modes and presets. Built from the local checkout, so no network.
substitutions:
  name: nachttischlampe-buero
  friendly_name: Nachttischlampe Büro
  external_components_source: vendor/esphome-xiaomi_bslamp2/components

packages:
  base: !include vendor/esphome-xiaomi_bslamp2/packages/core.yaml
  behavior: !include vendor/esphome-xiaomi_bslamp2/packages/behavior_default.yaml
  presets: !include vendor/esphome-xiaomi_bslamp2/packages/activate_preset_svc.yaml
  common: !include packages/common.yaml
  local: !include_dir_merge_named local/
