# Xiaomi Smart LED Desk Lamp Pro
#
# Upstream hardcodes the device name and an OTA password; both are overridden
# here so the device keeps its name and uses our secret.
substitutions:
  name: schreibtischlampe-buero

esphome:
  name: schreibtischlampe-buero
  friendly_name: Schreibtischlampe Büro

packages:
  base: !include vendor/xiaomi-smart-led-desk-lamp-pro-esphome/lamp.yaml
  common: !include packages/common.yaml
  local: !include_dir_merge_named local/
