# ============================================================================
# WORK IN PROGRESS - not yet opened, not yet flashed
#
# Yeelight Galaxy LED Deckenleuchte 480 (YLXD17YL)
#   32 W +/-10 %, 200-2200 lm at 4000 K, tunable 2700-5700 K, no RGB
#   night light ("moonlight") 0.1-100 lm at 2700 K
#   diameter 480 mm, WLAN 2.4 GHz + BLE 4.2
#   https://home.yeelight.de/produkte/deckenleuchten/galaxy-led-deckenleuchte/
#
# No upstream project supports this model - it appears in neither syssi's
# collection nor anywhere else searched, and the 450 mm sibling YLXD16YL is
# missing there too. So unlike the other devices here there is no hardware
# definition to build on and the pin map has to be established first.
#
# Closest documented relative: yeelight_light_ceiling15.yaml (YLXD42YL,
# yeelink.light.ceiling15) - 32 W, 2200 lm, 48 cm, so electrically and
# dimensionally almost the same lamp. Compare against that first; the channels
# to expect are cold white, warm white and a separate night light, which is the
# shape those configs already have.
#
# Before this can be flashed:
#   * open the device and identify the ESP module (UART pads, GPIO0 for
#     download mode)
#   * dump the stock firmware over UART first - no image for this model is
#     archived publicly, so that dump is the only way back:
#       esptool.py --port <port> -b 115200 read_flash 0x0 0x400000 stock.bin
#   * establish the LEDC pins for warm/cold white, the night light channel and
#     the power supply enable
# ============================================================================

substitutions:
  name: yeelight-galaxy-480

packages:
  common: !include packages/common.yaml
  local: !include_dir_merge_named local/

esphome:
  name: ${name}
  friendly_name: Yeelight Galaxy Ceiling Light 480
  comment: "YLXD17YL, Galaxy 480 - pin map not yet established"
  min_version: 2024.10.0

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
    advanced:
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true

api:
logger:
  level: INFO

# TODO: outputs and light. Nothing is guessed here on purpose - flashing an
# invented pin map risks driving the wrong transistor.
