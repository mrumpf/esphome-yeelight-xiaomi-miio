# House standards applied on top of every device config.
#
# Layered over the hardware definitions, which come from the vendor/
# submodules and are never modified here.
# Machine-specific values go in local/ (gitignored).

wifi:
  # Credentials belong here rather than in a hardware definition: not every
  # upstream package ships a wifi block, and a device flashed without one comes
  # up on its fallback AP instead of the network.
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Without a fallback AP a bad credential can only be fixed over UART,
  # which means opening the device.
  ap:
    ssid: "${name} ap"

captive_portal:

# Repository default. Override per machine by dropping a file into local/,
# which is gitignored - see local/README.md.
substitutions:
  ota_password: "secret42"

ota:
  - platform: esphome
    password: ${ota_password}

# API encryption is deliberately NOT enabled by default: switching it on makes
# Home Assistant drop the device until the key is entered again. To enable it,
# put the key in local/ (gitignored) and uncomment here:
#
# api:
#   encryption:
#     key: ${api_encryption_key}
