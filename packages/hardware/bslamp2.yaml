substitutions:
  name: yeelight-light-bslamp2
  external_components_source: github://syssi/esphome-yeelight-ceiling-light@main
  device_description: "Xiaomi Mijia Bedside Lamp 2 (yeelink.light.bslamp2)"

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}
  min_version: 2024.10.0

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
    advanced:
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome
logger:
  level: INFO

# ----------------------------------------------------------------------------
# Hardware
#
# The lamp is driven by an ESP32-WROOM-32D. The RGB and white LEDs hang off two
# master switches that must both be closed before any of them conduct.
# ----------------------------------------------------------------------------

i2c:
  - id: front_panel_bus
    sda: GPIO21
    scl: GPIO19
    scan: true

output:
  - platform: ledc
    id: output_red
    pin: GPIO13
    frequency: 3000Hz
    channel: 0
  - platform: ledc
    id: output_green
    pin: GPIO14
    frequency: 3000Hz
    channel: 1
  - platform: ledc
    id: output_blue
    pin: GPIO5
    frequency: 3000Hz
    channel: 2
  - platform: ledc
    id: output_white
    pin: GPIO12
    frequency: 10000Hz
    channel: 4

  # Both master switches must be on for the LEDs to light up.
  - platform: gpio
    id: output_master1
    pin: GPIO33
  - platform: gpio
    id: output_master2
    pin:
      number: GPIO4
      mode: OUTPUT

yeelight_front_panel:
  - id: front_panel
    model: bslamp2
    i2c_id: front_panel_bus
    trigger_pin: GPIO16
    # Set to true to log every message the panel sends, including the ones the
    # driver already understands. Useful when adding a new model.
    debug: false

# ----------------------------------------------------------------------------
# Entities
# ----------------------------------------------------------------------------

light:
  - platform: rgbw
    id: lamp
    name: Light
    red: output_red
    green: output_green
    blue: output_blue
    white: output_white
    color_interlock: true
    default_transition_length: 800ms
    on_turn_on:
      - output.turn_on: output_master1
      - output.turn_on: output_master2
    on_turn_off:
      - output.turn_off: output_master1
      - output.turn_off: output_master2
    on_state:
      # Mirror the light's brightness on the slider illumination, the way the
      # original firmware does.
      - lambda: |-
          auto values = id(lamp).current_values;
          float level = values.get_state() > 0.0f ? values.get_brightness() : 0.0f;
          id(front_panel)->set_slider_level(level);

binary_sensor:
  - platform: yeelight_front_panel
    yeelight_front_panel_id: front_panel
    part: power_button
    name: Power button
  - platform: yeelight_front_panel
    yeelight_front_panel_id: front_panel
    part: color_button
    name: Color button
  - platform: yeelight_front_panel
    yeelight_front_panel_id: front_panel
    part: slider
    name: Slider touched

sensor:
  - platform: yeelight_front_panel
    yeelight_front_panel_id: front_panel
    name: Slider level
